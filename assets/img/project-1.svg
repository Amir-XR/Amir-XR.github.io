<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" style="color:#7A4988">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="currentColor" stop-opacity="0.10"/>
      <stop offset="1" stop-color="currentColor" stop-opacity="0.03"/>
    </linearGradient>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="currentColor" stroke-opacity="0.18" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- Blueprint card -->
  <rect x="70" y="70" width="820" height="460" rx="28" fill="url(#g)" stroke="currentColor" stroke-width="10"/>

  <!-- Subtle grid field -->
  <rect x="110" y="190" width="520" height="320" rx="22" fill="url(#grid)" opacity="0.55"/>

  <!-- Title strip -->
  <rect x="110" y="110" width="520" height="56" rx="14" fill="none" stroke="currentColor" stroke-width="8"/>
  <path d="M140 138h70M225 138h130M380 138h120M530 138h70"
        fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>

  <!-- Warehouse / factory outline -->
  <path d="M155 402V268l120-70 120 70v134H155Z"
        fill="none" stroke="currentColor" stroke-width="10" stroke-linejoin="round"/>
  <path d="M205 402V320h60v82M305 402V320h60v82"
        fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>
  <path d="M235 305h90"
        fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-opacity="0.75"/>

  <!-- Interaction mode pills (place / demo / edit) -->
  <rect x="120" y="442" width="150" height="56" rx="18" fill="none" stroke="currentColor" stroke-width="8"/>
  <rect x="285" y="442" width="150" height="56" rx="18" fill="none" stroke="currentColor" stroke-width="8" stroke-opacity="0.85"/>
  <rect x="450" y="442" width="150" height="56" rx="18" fill="none" stroke="currentColor" stroke-width="8" stroke-opacity="0.70"/>
  <path d="M150 470h90M315 470h90M480 470h90"
        fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-opacity="0.85"/>

  <!-- VR headset (right) -->
  <path d="M650 265
           q0-55 55-55h150q55 0 55 55v70q0 55-55 55H705q-55 0-55-55Z"
        fill="none" stroke="currentColor" stroke-width="10" stroke-linejoin="round"/>
  <circle cx="720" cy="300" r="34" fill="none" stroke="currentColor" stroke-width="10" stroke-opacity="0.9"/>
  <circle cx="840" cy="300" r="34" fill="none" stroke="currentColor" stroke-width="10" stroke-opacity="0.9"/>
  <path d="M754 300h52" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M650 300h-44M910 300h44"
        fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-opacity="0.6"/>

  <!-- Tablet tool -->
  <rect x="690" y="398" width="180" height="104" rx="18" fill="none" stroke="currentColor" stroke-width="10" stroke-opacity="0.9"/>
  <circle cx="780" cy="414" r="6" fill="currentColor" opacity="0.75"/>
  <path d="M712 438h136M712 466h88M712 494h116"
        fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-opacity="0.75"/>
