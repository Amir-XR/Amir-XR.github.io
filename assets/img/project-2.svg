<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" style="color:#7A4988">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="currentColor" stop-opacity="0.10"/>
      <stop offset="1" stop-color="currentColor" stop-opacity="0.03"/>
    </linearGradient>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="currentColor" stroke-opacity="0.18" stroke-width="2"/>
    </pattern>

    <pattern id="microgrid" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M14 0H0V14" fill="none" stroke="currentColor" stroke-opacity="0.10" stroke-width="1.6"/>
    </pattern>
  </defs>

  <!-- Blueprint card -->
  <rect x="70" y="70" width="820" height="460" rx="28" fill="url(#g)" stroke="currentColor" stroke-width="10"/>

  <!-- Title strip -->
  <rect x="110" y="110" width="520" height="56" rx="14" fill="none" stroke="currentColor" stroke-width="8"/>
  <!-- "GaoDe" as blueprint strokes (no text for consistency) -->
  <path d="M142 138h46m16 0h48m16 0h64m16 0h46m16 0h62m16 0h36"
        fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-opacity="0.92"/>

  <!-- Main CAD viewport -->
  <rect x="110" y="190" width="520" height="320" rx="22" fill="url(#grid)" opacity="0.62"/>
  <rect x="132" y="212" width="476" height="276" rx="18" fill="url(#microgrid)" opacity="0.55"/>

  <!-- Parametric node graph (Grasshopper vibe) -->
  <path d="M170 250h70m30 0h70m30 0h64"
        fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-opacity="0.55"/>
  <circle cx="170" cy="250" r="8" fill="none" stroke="currentColor" stroke-width="7" stroke-opacity="0.75"/>
  <circle cx="270" cy="250" r="8" fill="none" stroke="currentColor" stroke-width="7" stroke-opacity="0.75"/>
  <circle cx="370" cy="250" r="8" fill="none" stroke="currentColor" stroke-width="7" stroke-opacity="0.75"/>
  <circle cx="464" cy="250" r="8" fill="none" stroke="currentColor" stroke-width="7" stroke-opacity="0.75"/>

  <!-- Wireframe "design target" composition -->
  <g fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round">
    <!-- base platform -->
    <path d="M185 438l170-60 170 60-170 60Z" stroke-width="8" stroke-opacity="0.85"/>
    <path d="M355 378v128" stroke-width="6" stroke-opacity="0.55"/>

    <!-- stacked modules (serious game building blocks) -->
    <path d="M250 406l70-25 70 25-70 25Z" stroke-width="7" stroke-opacity="0.9"/>
    <path d="M250 406v62l70 25 70-25v-62" stroke-width="6" stroke-opacity="0.75"/>

    <path d="M330 356l54-20 54 20-54 20Z" stroke-width="7" stroke-opacity="0.85"/>
    <path d="M330 356v52l54 20 54-20v-52" stroke-width="6" stroke-opacity="0.7"/>

    <!-- expressive curve (freeform / Gehry-ish hint) -->
    <path d="M470 400c40-58 78-56 112 4c-22 26-58 40-94 34c-22-4-36-16-18-38Z"
          stroke-width="7" stroke-opacity="0.72"/>
    <path d="M486 418c30-40 58-38 80 2" stroke-width="6" stroke-opacity="0.55"/>
  </g>

  <!-- Multimodal input stack (right) -->
  <rect x="660" y="190" width="210" height="320" rx="22" fill="none" stroke="currentColor" stroke-width="10" stroke-opacity="0.9"/>

  <!-- Gesture (hand) -->
  <rect x="690" y="215" width="150" height="78" rx="18" fill="none" stroke="currentColor" stroke-width="9" stroke-opacity="0.9"/>
  <g transform="translate(708 230)" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round">
    <!-- simple hand icon -->
    <path d="M38 36v-18c0-5 4-9 9-9s9 4 9 9v14
             M38 30v-20c0-5-4-9-9-9s-9 4-9 9v22
             M38 33v-14c0-5 4-9 9-9s9 4 9 9v18
             M20 42c-10-4-14-14-14-22 0-6 4-10 10-10h7"
          stroke-width="6" stroke-opacity="0.8"/>
    <path d="M20 44c6 10 18 16 32 16 14 0 26-6 32-16"
          stroke-width="6" stroke-opacity="0.55"/>
  </g>

  <!-- Vision (camera) -->
  <rect x="690" y="305" width="150" height="78" rx="18" fill="none" stroke="currentColor" stroke-width="9" stroke-opacity="0.82"/>
  <g transform="translate(705 321)" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 18h24l10-10h44c8 0 14 6 14 14v30c0 8-6 14-14 14H20c-8 0-14-6-14-14V18Z"
          stroke-width="7" stroke-opacity="0.75"/>
    <circle cx="66" cy="42" r="16" stroke-width="7" stroke-opacity="0.85"/>
    <path d="M94 18h14" stroke-width="7" stroke-opacity="0.6"/>
  </g>

  <!-- Speech (microphone) -->
  <rect x="690" y="395" width="150" height="78" rx="18" fill="none" stroke="currentColor" stroke-width="9" stroke-opacity="0.74"/>
  <g transform="translate(723 408)" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M42 10c0-10 8-18 18-18s18 8 18 18v24c0 10-8 18-18 18s-18-8-18-18Z"
          stroke-width="7" stroke-opacity="0.82"/>
    <path d="M30 34c0 16 12 28 30 28s30-12 30-28"
          stroke-width="7" stroke-opacity="0.62"/>
    <path d="M60 62v22M45 84h30"
          stroke-width="7" stroke-opacity="0.62"/>
  </g>

  <!-- Bottom mode pills (gesture / vision / speech) -->
</svg>
