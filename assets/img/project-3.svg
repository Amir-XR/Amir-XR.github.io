<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" style="color:#7A4988">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="currentColor" stop-opacity="0.11"/>
      <stop offset="1" stop-color="currentColor" stop-opacity="0.03"/>
    </linearGradient>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="currentColor" stroke-opacity="0.18" stroke-width="2"/>
    </pattern>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="currentColor" opacity="0.65"/>
    </marker>
  </defs>

  <!-- Blueprint card -->
  <rect x="70" y="70" width="820" height="460" rx="28" fill="url(#g)" stroke="currentColor" stroke-width="10"/>

  <!-- Title strip -->
  <rect x="110" y="110" width="640" height="56" rx="14" fill="none" stroke="currentColor" stroke-width="8"/>
  <path d="M140 138h120M280 138h210M510 138h210"
        fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-opacity="0.85"/>

  <!-- Grid field (left) -->
  <rect x="110" y="190" width="520" height="320" rx="22" fill="url(#grid)" opacity="0.55"/>

  <!-- Tower outline (left) -->
  <path d="M170 494V250
           q0-26 22-40
           l88-58
           q18-12 40 0
           l88 58
           q22 14 22 40
           V494Z"
        fill="none" stroke="currentColor" stroke-width="10" stroke-linejoin="round"/>

  <!-- Core / floor markers -->
  <path d="M240 494V280M390 494V280"
        fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-opacity="0.65"/>
  <path d="M205 320H505M205 362H505M205 404H505M205 446H505"
        fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-opacity="0.35"/>

  <!-- Diagrid / exoskeleton pattern -->
  <path d="M205 494L335 362L465 494
           M205 446L335 320L465 446
           M205 404L335 280L465 404
           M205 362L300 280
           M370 280L465 362"
        fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85"/>

  <!-- Topology "voids" (suggest BESO carving) -->
  <path d="M250 410
           q40-45 85 0
           q-45 55-85 0Z"
        fill="none" stroke="currentColor" stroke-width="8" stroke-opacity="0.55" stroke-linejoin="round"/>
  <path d="M360 340
           q38-42 80 0
           q-42 52-80 0Z"
        fill="none" stroke="currentColor" stroke-width="8" stroke-opacity="0.45" stroke-linejoin="round"/>

  <!-- Wind + gravity cues -->
  <path d="M560 230h110" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-opacity="0.55" marker-end="url(#arrow)"/>
  <path d="M560 262h88"  fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-opacity="0.45" marker-end="url(#arrow)"/>
  <path d="M560 294h66"  fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-opacity="0.35" marker-end="url(#arrow)"/>
  <path d="M740 214v62"  fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-opacity="0.45" marker-end="url(#arrow)"/>

  <!-- Computational / parametric graph (right) -->
  <rect x="650" y="300" width="220" height="210" rx="22" fill="none" stroke="currentColor" stroke-width="10" stroke-opacity="0.9"/>
  <path d="M680 340h160M680 382h120M680 424h150M680 466h92"
        fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- Nodes + links -->
  <circle cx="690" cy="346" r="7" fill="currentColor" opacity="0.75"/>
  <circle cx="820" cy="346" r="7" fill="currentColor" opacity="0.55"/>
  <circle cx="740" cy="388" r="7" fill="currentColor" opacity="0.65"/>
  <circle cx="840" cy="430" r="7" fill="currentColor" opacity="0.6"/>
  <circle cx="720" cy="472" r="7" fill="currentColor" opacity="0.55"/>
  <path d="M690 346L740 388L820 346
           M740 388L840 430
           M740 388L720 472
           M720 472L840 430"
        fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.45"/>

  <!-- Tiny legend ticks -->
  <path d="M768 130h95M768 150h70" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-opacity="0.45"/>
</svg>
