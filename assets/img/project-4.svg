<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" style="color:#7A4988">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="currentColor" stop-opacity="0.11"/>
      <stop offset="1" stop-color="currentColor" stop-opacity="0.03"/>
    </linearGradient>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="currentColor" stroke-opacity="0.18" stroke-width="2"/>
    </pattern>

    <pattern id="lattice" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M0 0L26 26M26 0L0 26" fill="none" stroke="currentColor" stroke-opacity="0.32" stroke-width="3" stroke-linecap="round"/>
    </pattern>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="currentColor" opacity="0.65"/>
    </marker>
  </defs>

  <!-- Blueprint card -->
  <rect x="70" y="70" width="820" height="460" rx="28" fill="url(#g)" stroke="currentColor" stroke-width="10"/>

  <!-- Title strip -->
  <rect x="110" y="110" width="640" height="56" rx="14" fill="none" stroke="currentColor" stroke-width="8"/>
  <path d="M140 138h140M300 138h170M490 138h220"
        fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-opacity="0.85"/>

  <!-- Grid field -->
  <rect x="110" y="190" width="520" height="320" rx="22" fill="url(#grid)" opacity="0.55"/>

  <!-- Pavilion frame (left) -->
  <path d="M150 490V255h440V490" fill="none" stroke="currentColor" stroke-width="10" stroke-linejoin="round"/>
  <path d="M150 255l50-40h340l50 40" fill="none" stroke="currentColor" stroke-width="10" stroke-linejoin="round" stroke-opacity="0.9"/>

  <!-- Ceiling grid inside pavilion -->
  <path d="M180 255V232M250 255V214M320 255V232M390 255V214M460 255V232M530 255V214"
        fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-opacity="0.45"/>
  <path d="M170 268H570M170 300H570" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-opacity="0.35"/>

  <!-- Orosi lattice panel (center) -->
  <rect x="270" y="280" width="200" height="170" rx="18" fill="url(#lattice)" stroke="currentColor" stroke-width="10" stroke-opacity="0.95"/>
  <path d="M270 325h200M270 370h200M270 415h200" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-opacity="0.35"/>
  <path d="M315 280v170M360 280v170M405 280v170" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-opacity="0.30"/>

  <!-- Three kinetic sliding layers (RGB concept) -->
  <rect x="235" y="250" width="270" height="22" rx="11" fill="none" stroke="currentColor" stroke-width="8" stroke-opacity="0.65"/>
  <rect x="260" y="246" width="140" height="30" rx="15" fill="none" stroke="currentColor" stroke-width="8" stroke-opacity="0.45"/>
  <rect x="355" y="246" width="140" height="30" rx="15" fill="none" stroke="currentColor" stroke-width="8" stroke-opacity="0.35"/>

  <!-- Hanging fabric modules -->
  <path d="M195 300v150M230 300v190M265 300v165M500 300v175M535 300v140M570 300v200"
        fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-opacity="0.85"/>
  <path d="M195 450h0M230 490h0M265 465h0M500 475h0M535 440h0M570 500h0"
        fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-opacity="0.55"/>

  <!-- Wind cues (right) -->
  <path d="M650 240h160" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-opacity="0.55" marker-end="url(#arrow)"/>
  <path d="M650 272h130" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-opacity="0.45" marker-end="url(#arrow)"/>
  <path d="M650 304h95"  fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-opacity="0.35" marker-end="url(#arrow)"/>

  <!-- Proximity / sensing icon -->
  <circle cx="770" cy="380" r="44" fill="none" stroke="currentColor" stroke-width="10" stroke-opacity="0.9"/>
  <circle cx="770" cy="380" r="20" fill="none" stroke="currentColor" stroke-width="8" stroke-opacity="0.65"/>
  <path d="M740 410q30 28 60 0" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-opacity="0.55"/>
  <path d="M770 336v-22" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-opacity="0.55"/>

  <!-- Actuation block (servo/linear/SMA abstraction) -->
  <rect x="650" y="440" width="220" height="70" rx="18" fill="none" stroke="currentColor" stroke-width="10" stroke-opacity="0.85"/>
  <path d="M680 475h70M770 475h70M725 458v34M815 458v34"
        fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-opacity="0.65"/>
</svg>
