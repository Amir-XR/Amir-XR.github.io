  <text x="100" y="146" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;fill:var(--ash,rgba(243,238,227,0.55))">CONTINUOUS MAINTENANCE</text>

  <path d="M113 178 a7 7 0 1 1 -4 -13 a5.8 5.8 0 0 0 4 13 z" style="fill:var(--accent,#c08bd2)"/>
  <text x="120" y="172" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10px;letter-spacing:.12em;text-transform:uppercase;fill:var(--ink,#f3eee3)">NIGHT WORKER</text>
  <text x="214" y="172" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10px;fill:var(--ash,rgba(243,238,227,0.55))">·</text>
  <path d="M232 165 l2.4 4.8 4.8 2.4 -4.8 2.4 -2.4 4.8 -2.4 -4.8 -4.8 -2.4 4.8 -2.4 z" style="fill:var(--accent,#c08bd2)"/>
  <text x="246" y="172" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10px;letter-spacing:.12em;text-transform:uppercase;fill:var(--ink,#f3eee3)">ENRICH WORKER</text>
  <text x="348" y="172" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10px;fill:var(--ash,rgba(243,238,227,0.55))">·</text>
  <g style="fill:none;stroke:var(--accent,#c08bd2);stroke-width:1.35;stroke-linecap:round">
    <circle cx="366" cy="172" r="7"/>
    <path d="M366 172 L371 167"/>
  </g>
  <text x="380" y="172" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10px;letter-spacing:.12em;text-transform:uppercase;fill:var(--ink,#f3eee3)">SUPERVISOR AGENT</text>
  <text x="503" y="172" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10px;fill:var(--ash,rgba(243,238,227,0.55))">·</text>
  <g style="fill:none;stroke:var(--accent,#c08bd2);stroke-width:1.35;stroke-linecap:round">
    <circle cx="518" cy="166" r="4"/>
    <path d="M512 178 a6 6 0 0 1 12 0"/>
  </g>
  <text x="531" y="172" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10px;letter-spacing:.12em;text-transform:uppercase;fill:var(--ink,#f3eee3)">HUMAN ATTENTION</text>
  <path d="M662 178 a9 9 0 1 1 7 -14 M669 164 v6 h-6" style="fill:none;stroke:var(--accent,#c08bd2);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"/>

  <!-- closing -->
  <text x="360" y="216" text-anchor="middle" style="font-family:var(--display,'Fraunces',serif);font-weight:600;font-size:20px;fill:var(--ink,#f3eee3)">Have we built this before?</text>
  <text x="360" y="240" text-anchor="middle" style="font-family:var(--italic,'Instrument Serif',serif);font-style:italic;font-size:15px;fill:var(--accent-deep,#a36cb6)">Now the archive can answer.</text>
