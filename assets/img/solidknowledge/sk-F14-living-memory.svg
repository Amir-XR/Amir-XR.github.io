<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="skF14-title" style="font-family:var(--serif,'Newsreader',Georgia,serif);background:#0b0c10"><style>@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700&amp;family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;display=swap');</style>
  <title id="skF14-title">From CAD archive to living design memory: the archive becomes evidence, a knowledge graph, a semantic space, search and finally reuse — held true by a band of continuous maintenance run by the night worker, the enrich worker, the supervisor agent and human attention.</title>
  <defs>
    <marker id="skF14-arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" style="fill:var(--rule-bold,rgba(243,238,227,0.42))"/>
    </marker>
  </defs>

  <!-- the engineer -->
  <g style="fill:none;stroke:var(--ink-2,#c5c1b8);stroke-width:1.5;stroke-linecap:round">
    <circle cx="34" cy="48" r="6"/>
    <path d="M25 66 a9 9 0 0 1 18 0"/>
  </g>
  <path d="M48 56 H74" style="fill:none;stroke:var(--rule-bold,rgba(243,238,227,0.42));stroke-width:1.5;stroke-linecap:round;stroke-dasharray:1.5 5"/>

  <!-- stage 1: CAD archive -->
  <rect x="80" y="20" width="92" height="72" rx="10" style="fill:var(--paper-3,#181922);stroke:var(--rule,rgba(243,238,227,0.14));stroke-width:1"/>
