    <circle cx="547" cy="42" r="8"/>
    <path d="M553 48 L560 55"/>
  </g>
  <text x="550" y="80" text-anchor="middle" style="font-family:var(--display,'Fraunces',serif);font-weight:600;font-size:10.5px;fill:var(--ink,#f3eee3)">Search</text>
  <path d="M598 56 H608" style="fill:none;stroke:var(--rule-bold,rgba(243,238,227,0.42));stroke-width:1" marker-end="url(#skF14-arw)"/>

