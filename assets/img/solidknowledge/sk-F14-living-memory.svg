  <text x="126" y="80" text-anchor="middle" style="font-family:var(--display,'Fraunces',serif);font-weight:600;font-size:10.5px;fill:var(--ink,#f3eee3)">CAD Archive</text>
  <path d="M174 56 H184" style="fill:none;stroke:var(--rule-bold,rgba(243,238,227,0.42));stroke-width:1" marker-end="url(#skF14-arw)"/>

  <!-- stage 2: evidence -->
  <rect x="186" y="20" width="92" height="72" rx="10" style="fill:var(--paper-3,#181922);stroke:var(--rule,rgba(243,238,227,0.14));stroke-width:1"/>
  <rect x="218" y="40" width="22" height="16" rx="3" style="fill:var(--paper-2,#12131a);stroke:var(--ink-2,#c5c1b8);stroke-width:1.5"/>
  <rect x="224" y="34" width="22" height="16" rx="3" style="fill:var(--paper-3,#181922);stroke:var(--ink-2,#c5c1b8);stroke-width:1.5"/>
  <text x="232" y="80" text-anchor="middle" style="font-family:var(--display,'Fraunces',serif);font-weight:600;font-size:10.5px;fill:var(--ink,#f3eee3)">Evidence</text>
  <path d="M280 56 H290" style="fill:none;stroke:var(--rule-bold,rgba(243,238,227,0.42));stroke-width:1" marker-end="url(#skF14-arw)"/>

