<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="skF11-title" style="font-family:var(--serif,'Newsreader',Georgia,serif);background:#0b0c10"><style>@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700&amp;family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;display=swap');</style>
  <title id="skF11-title">Knowledge drift: a CAD assembly extracted and enriched in March produces a knowledge card that is in sync; by July the assembly has been revised, and the same card is now stale.</title>
  <defs>
    <marker id="skF11-arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" style="fill:var(--rule-bold,rgba(243,238,227,0.42))"/>
    </marker>
  </defs>

  <!-- left: CAD v1 -->
  <rect x="64" y="10" width="140" height="78" rx="10" style="fill:var(--paper-3,#181922);stroke:var(--rule,rgba(243,238,227,0.14));stroke-width:1"/>
  <g style="stroke:var(--accent,#c08bd2);stroke-width:1.5;stroke-linejoin:round">
    <polygon points="134,22 158,36 134,50 110,36" style="fill:var(--accent-soft,rgba(192,139,210,0.14))"/>
    <polygon points="110,36 134,50 134,76 110,62" style="fill:none"/>
    <polygon points="158,36 134,50 134,76 158,62" style="fill:none"/>
  </g>
  <text x="134" y="102" text-anchor="middle" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:11px;fill:var(--ink,#f3eee3)">CAD v1</text>
  <path d="M134 110 V128" style="fill:none;stroke:var(--rule-bold,rgba(243,238,227,0.42));stroke-width:1.5" marker-end="url(#skF11-arw)"/>
  <rect x="54" y="132" width="160" height="50" rx="10" style="fill:var(--paper-3,#181922);stroke:var(--accent,#c08bd2);stroke-width:1.5"/>
  <text x="68" y="152" style="font-family:var(--display,'Fraunces',serif);font-weight:600;font-size:13px;fill:var(--ink,#f3eee3)">Knowledge card</text>
  <path d="M68 166 l5 6 10 -12" style="fill:none;stroke:var(--accent,#c08bd2);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round"/>
  <text x="92" y="172" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:11px;fill:var(--accent,#c08bd2)">IN SYNC</text>

  <!-- drift between -->
  <text x="359" y="36" text-anchor="middle" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:11px;fill:var(--ash,rgba(243,238,227,0.55))">projects evolve · new files land</text>
  <path d="M216 48 H502" style="fill:none;stroke:var(--rule-bold,rgba(243,238,227,0.42));stroke-width:1.5;stroke-linecap:round;stroke-dasharray:1.5 7" marker-end="url(#skF11-arw)"/>

  <!-- right: CAD v2, modified -->
  <rect x="516" y="10" width="140" height="78" rx="10" style="fill:var(--paper-3,#181922);stroke:var(--rule,rgba(243,238,227,0.14));stroke-width:1"/>
  <g style="stroke:var(--ash,rgba(243,238,227,0.55));stroke-width:1.5;stroke-linejoin:round;fill:none">
    <polygon points="586,22 610,36 586,50 562,36"/>
    <polygon points="562,36 586,50 586,76 562,62"/>
  </g>
  <polygon points="610,36 586,50 586,76 610,62" style="fill:var(--accent-soft,rgba(192,139,210,0.14));stroke:var(--accent,#c08bd2);stroke-width:2;stroke-linejoin:round"/>
  <circle cx="610" cy="36" r="4" style="fill:var(--accent,#c08bd2)"/>
  <text x="586" y="102" text-anchor="middle" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:11px;fill:var(--accent,#c08bd2)">CAD v2 — MODIFIED</text>
  <path d="M586 110 V128" style="fill:none;stroke:var(--rule-bold,rgba(243,238,227,0.42));stroke-width:1.5" marker-end="url(#skF11-arw)"/>
  <rect x="498" y="132" width="176" height="50" rx="10" style="fill:var(--paper-3,#181922);stroke:var(--accent,#c08bd2);stroke-width:1.5;stroke-dasharray:4 4"/>
  <text x="512" y="152" style="font-family:var(--display,'Fraunces',serif);font-weight:600;font-size:13px;fill:var(--ink,#f3eee3)">Knowledge card v1</text>
  <g style="fill:none;stroke:var(--accent,#c08bd2);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round">
    <path d="M519 159 l8 13 h-16 z"/>
    <path d="M519 164 v3"/>
  </g>
  <text x="536" y="172" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:11px;fill:var(--accent,#c08bd2)">STALE — v1</text>

  <!-- timeline -->
  <path d="M60 196 H660" style="fill:none;stroke:var(--rule,rgba(243,238,227,0.14));stroke-width:1"/>
  <g style="fill:none;stroke:var(--rule-bold,rgba(243,238,227,0.42));stroke-width:1.5">
    <path d="M134 190 V202"/>
    <path d="M586 190 V202"/>
  </g>
  <text x="60" y="216" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;fill:var(--ash,rgba(243,238,227,0.55))">MARCH · EXTRACTED + ENRICHED</text>
  <text x="660" y="216" text-anchor="end" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;fill:var(--ash,rgba(243,238,227,0.55))">JULY · ASSEMBLY REVISED</text>

  <!-- question -->
  <text x="386" y="240" text-anchor="end" style="font-family:var(--display,'Fraunces',serif);font-weight:600;font-size:20px;fill:var(--ink,#f3eee3)">Is the knowledge</text>
  <text x="392" y="240" style="font-family:var(--display,'Fraunces',serif);font-weight:600;font-size:20px;fill:var(--accent,#c08bd2)">still true?</text>
</svg>