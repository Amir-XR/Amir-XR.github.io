  <g style="font-family:var(--display,'Fraunces',serif);font-weight:600;font-size:13px;fill:var(--ink,#f3eee3)">
    <text x="38" y="118">File node’s</text>
    <text x="38" y="134">data</text>
  </g>
  <line x1="38" y1="146" x2="142" y2="146" style="stroke:var(--rule,rgba(243,238,227,0.14));stroke-width:1"/>
  <text x="38" y="162" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10.5px;fill:var(--ash,rgba(243,238,227,0.55))">unstructured</text>

