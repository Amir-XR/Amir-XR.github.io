<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="skF13-title" style="font-family:var(--serif,'Newsreader',Georgia,serif);background:#0b0c10"><style>@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700&amp;family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;display=swap');</style>
  <title id="skF13-title">A Supervisor Agent observes, detects, proposes and escalates: it watches the live CAD archive against the published knowledge the two workers build, and escalates a stale assembly to human attention, which can approve a re-enrichment.</title>
  <defs>
    <marker id="skF13-arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" style="fill:var(--rule-bold,rgba(243,238,227,0.42))"/>
    </marker>
    <marker id="skF13-arwa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" style="fill:var(--accent,#c08bd2)"/>
    </marker>
  </defs>

  <!-- supervisor -->
  <rect x="150" y="14" width="320" height="52" rx="10" style="fill:var(--paper-3,#181922);stroke:var(--accent,#c08bd2);stroke-width:1.5"/>
  <g style="fill:none;stroke:var(--accent,#c08bd2);stroke-width:1.5;stroke-linecap:round">
    <circle cx="176" cy="40" r="11"/>
    <path d="M176 40 L183.5 32.5"/>
  </g>
  <circle cx="176" cy="40" r="1.6" style="fill:var(--accent,#c08bd2)"/>
  <text x="198" y="38" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:12px;letter-spacing:.12em;text-transform:uppercase;fill:var(--ink,#f3eee3)">SUPERVISOR AGENT</text>
  <text x="198" y="56" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10.5px;fill:var(--ash,rgba(243,238,227,0.55))">OBSERVE → DETECT → PROPOSE → </text>
  <text x="381" y="56" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10.5px;fill:var(--accent,#c08bd2)">ESCALATE</text>

  <!-- supervisor to workers -->
  <g style="fill:none;stroke:var(--rule-bold,rgba(243,238,227,0.42));stroke-width:1.5;stroke-dasharray:4 4">
    <path d="M226 68 V122" marker-end="url(#skF13-arw)"/>
    <path d="M394 68 V122" marker-end="url(#skF13-arw)"/>
    <path d="M156 66 L74 232" marker-end="url(#skF13-arw)"/>
  </g>
  <text x="16" y="170" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10.5px;fill:var(--ash,rgba(243,238,227,0.55))">watches the</text>
  <text x="16" y="184" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10.5px;fill:var(--ash,rgba(243,238,227,0.55))">archive</text>

  <!-- night worker -->
  <rect x="150" y="126" width="152" height="76" rx="10" style="fill:var(--paper-3,#181922);stroke:var(--rule,rgba(243,238,227,0.14));stroke-width:1"/>
  <path d="M177 150 a8 8 0 1 1 -4.5 -15 a6.7 6.7 0 0 0 4.5 15 z" style="fill:var(--accent,#c08bd2)"/>
  <text x="184" y="148" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;fill:var(--ink,#f3eee3)">NIGHT WORKER</text>
  <text x="164" y="170" style="font-size:12.5px;fill:var(--ink-2,#c5c1b8)">CAD extraction</text>
  <circle cx="168" cy="186" r="2.5" style="fill:var(--accent,#c08bd2)"/>
  <text x="178" y="190" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10.5px;fill:var(--ash,rgba(243,238,227,0.55))">night run · clean</text>

  <!-- enrich worker -->
  <rect x="318" y="126" width="152" height="76" rx="10" style="fill:var(--paper-3,#181922);stroke:var(--rule,rgba(243,238,227,0.14));stroke-width:1"/>
  <path d="M340 135 l2.6 5.2 5.2 2.6 -5.2 2.6 -2.6 5.2 -2.6 -5.2 -5.2 -2.6 5.2 -2.6 z" style="fill:var(--accent,#c08bd2)"/>
  <text x="352" y="148" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;fill:var(--ink,#f3eee3)">ENRICH WORKER</text>
  <text x="332" y="170" style="font-size:12.5px;fill:var(--ink-2,#c5c1b8)">Transformation</text>
  <circle cx="336" cy="186" r="2.5" style="fill:var(--accent,#c08bd2)"/>
  <text x="346" y="190" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10.5px;fill:var(--ash,rgba(243,238,227,0.55))">standing · 24/7</text>

  <!-- workers publish -->
  <g style="fill:none;stroke:var(--accent,#c08bd2);stroke-width:1.5;stroke-dasharray:4 4">
    <path d="M226 206 L250 236" marker-end="url(#skF13-arwa)"/>
    <path d="M394 206 L362 236" marker-end="url(#skF13-arwa)"/>
  </g>

  <!-- live cad archive -->
  <rect x="16" y="238" width="100" height="68" rx="10" style="fill:var(--paper-2,#12131a);stroke:var(--rule,rgba(243,238,227,0.14));stroke-width:1"/>
  <path d="M52 252 q0 -3 3 -3 h7 l3 3 h12 q3 0 3 3 v11 q0 3 -3 3 h-22 q-3 0 -3 -3 z" style="fill:none;stroke:var(--ink-2,#c5c1b8);stroke-width:1.5;stroke-linejoin:round"/>
  <text x="66" y="286" text-anchor="middle" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10px;letter-spacing:.1em;text-transform:uppercase;fill:var(--ink,#f3eee3)">LIVE CAD</text>
  <text x="66" y="299" text-anchor="middle" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10px;letter-spacing:.1em;text-transform:uppercase;fill:var(--ink,#f3eee3)">ARCHIVE</text>
  <text x="133" y="232" text-anchor="middle" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10.5px;fill:var(--ash,rgba(243,238,227,0.55))">compared</text>
  <path d="M120 272 H148" style="fill:none;stroke:var(--rule-bold,rgba(243,238,227,0.42));stroke-width:1.5;stroke-dasharray:4 4" marker-end="url(#skF13-arw)"/>

  <!-- published knowledge -->
  <rect x="150" y="238" width="290" height="68" rx="10" style="fill:var(--paper-3,#181922);stroke:var(--rule,rgba(243,238,227,0.14));stroke-width:1"/>
  <g style="fill:var(--accent,#c08bd2)">
    <circle cx="170" cy="266" r="3"/>
    <circle cx="184" cy="260" r="2.5"/>
    <circle cx="190" cy="274" r="2.8"/>
    <circle cx="174" cy="278" r="2.5"/>
  </g>
  <text x="206" y="272" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:11px;letter-spacing:.12em;text-transform:uppercase;fill:var(--ink,#f3eee3)">PUBLISHED KNOWLEDGE</text>
  <text x="206" y="290" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10.5px;fill:var(--ash,rgba(243,238,227,0.55))">what search serves</text>

  <!-- human attention -->
  <text x="490" y="112" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;fill:var(--ash,rgba(243,238,227,0.55))">HUMAN ATTENTION</text>
  <rect x="490" y="126" width="214" height="124" rx="10" style="fill:var(--paper-3,#181922);stroke:var(--accent,#c08bd2);stroke-width:1.5"/>
  <circle cx="506" cy="147" r="3.5" style="fill:var(--accent,#c08bd2)"/>
  <text x="518" y="151" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:11px;letter-spacing:.1em;text-transform:uppercase;fill:var(--accent,#c08bd2)">ATTENTION REQUIRED</text>
  <text x="506" y="176" style="font-size:13px;fill:var(--ink,#f3eee3)">Assembly changed after</text>
  <text x="506" y="193" style="font-size:13px;fill:var(--ink,#f3eee3)">enrichment</text>
  <text x="506" y="212" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10.5px;fill:var(--ash,rgba(243,238,227,0.55))">W1101 · stale ×4</text>
  <rect x="506" y="220" width="70" height="22" rx="6" style="fill:none;stroke:var(--rule-bold,rgba(243,238,227,0.42));stroke-width:1"/>
  <text x="541" y="235" text-anchor="middle" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10px;letter-spacing:.1em;text-transform:uppercase;fill:var(--ink-2,#c5c1b8)">REVIEW</text>
  <rect x="584" y="220" width="70" height="22" rx="6" style="fill:var(--accent-soft,rgba(192,139,210,0.14));stroke:var(--accent,#c08bd2);stroke-width:1"/>
  <text x="619" y="235" text-anchor="middle" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10px;letter-spacing:.1em;text-transform:uppercase;fill:var(--accent,#c08bd2)">RE-RUN</text>

  <!-- escalation and return -->
  <g style="fill:none;stroke:var(--accent,#c08bd2);stroke-width:1.5;stroke-dasharray:4 4;stroke-linejoin:round">
    <path d="M470 46 L486 146" marker-end="url(#skF13-arwa)"/>
    <path d="M540 250 V266 H450 V196" marker-end="url(#skF13-arwa)"/>
  </g>
  <text x="490" y="80" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10.5px;fill:var(--ash,rgba(243,238,227,0.55))">escalates for judgment</text>
  <text x="548" y="270" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10.5px;fill:var(--ash,rgba(243,238,227,0.55))">approve → re-enrich</text>

  <!-- closing line -->
  <text x="357" y="330" text-anchor="end" style="font-size:15px;fill:var(--ink-2,#c5c1b8)">The workers build the memory.</text>
  <text x="363" y="330" style="font-family:var(--display,'Fraunces',serif);font-weight:600;font-size:15px;fill:var(--ink,#f3eee3)">The Supervisor keeps it true.</text>
</svg>