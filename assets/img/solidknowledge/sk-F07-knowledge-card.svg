  <text x="248" y="278" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:11.5px;fill:var(--ink,#f3eee3)"><tspan style="fill:var(--accent-deep,#a36cb6)">"search_aliases":</tspan> "curved fascia; rolled panel;</text>
  <text x="248" y="292.5" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:11.5px;fill:var(--ink,#f3eee3)">cleat-hung cladding",</text>

