  <text x="248" y="128" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:11.5px;fill:var(--ink,#f3eee3)"><tspan style="fill:var(--accent-deep,#a36cb6)">"material_finish":</tspan> "AL 5052 sheet &#183; matte powder coat.",</text>
