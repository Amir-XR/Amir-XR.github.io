  <text x="248" y="175.5" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:11.5px;font-style:italic;fill:var(--ash,rgba(243,238,227,0.55))">// controlled classification</text>
  <text x="248" y="190" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:11.5px;fill:var(--ink,#f3eee3)"><tspan style="fill:var(--accent-deep,#a36cb6)">"object_type":</tspan> "fascia",</text>
  <text x="248" y="204.5" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:11.5px;fill:var(--ink,#f3eee3)"><tspan style="fill:var(--accent-deep,#a36cb6)">"DI_tags":</tspan> [</text>

