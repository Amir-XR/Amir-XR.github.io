<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 134" role="img" aria-labelledby="hadF00-title" style="font-family:var(--serif,'Newsreader',Georgia,serif);background:#0b0c10">
  <title id="hadF00-title">HAD in five stages: design model, scene context, typed intent, solver and checks, placed and undoable geometry.</title>
  <style>@import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600&amp;family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;display=swap');</style>
  <defs>
    <marker id="hadF00-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0.8 L7.4 4 L0 7.2 Z" style="fill:var(--rule-bold,rgba(243,238,227,0.42))"/>
    </marker>
  </defs>

  <!-- 01 design model: plan outline, two rooms -->
  <rect x="24" y="24" width="112" height="86" rx="10" style="fill:var(--paper-2,#12131a);stroke:var(--rule,rgba(243,238,227,0.14));stroke-width:1"/>
  <g transform="translate(71,34)" style="fill:none;stroke:var(--ink-2,#c5c1b8);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round">
    <rect x="1" y="2" width="16" height="14" rx="1"/>
    <path d="M10 2 V7.5 M10 11.5 V16"/>
  </g>
  <text x="80" y="68" text-anchor="middle" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10.5px;letter-spacing:.14em;fill:var(--ash,rgba(243,238,227,0.55))">01</text>
  <text x="80" y="86" text-anchor="middle" style="font-family:var(--display,'Fraunces',serif);font-weight:600;font-size:12px;fill:var(--ink,#f3eee3)">Design</text>
  <text x="80" y="102" text-anchor="middle" style="font-family:var(--display,'Fraunces',serif);font-weight:600;font-size:12px;fill:var(--ink,#f3eee3)">model</text>

  <path d="M142 66 H160" style="fill:none;stroke:var(--rule-bold,rgba(243,238,227,0.42));stroke-width:1" marker-end="url(#hadF00-arrow)"/>

  <!-- 02 scene context: three cards -->
  <rect x="164" y="24" width="112" height="86" rx="10" style="fill:var(--paper-2,#12131a);stroke:var(--rule,rgba(243,238,227,0.14));stroke-width:1"/>
  <g transform="translate(210.5,34)" style="fill:none;stroke:var(--ink-2,#c5c1b8);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round">
    <rect x="1" y="7.5" width="12" height="9" rx="1.5"/>
    <path d="M3.5 7.5 V4.5 H15.5 V13.5 H13 M6 4.5 V1.5 H18 V10.5 H15.5"/>
  </g>
  <text x="220" y="68" text-anchor="middle" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10.5px;letter-spacing:.14em;fill:var(--ash,rgba(243,238,227,0.55))">02</text>
  <text x="220" y="86" text-anchor="middle" style="font-family:var(--display,'Fraunces',serif);font-weight:600;font-size:12px;fill:var(--ink,#f3eee3)">Scene</text>
  <text x="220" y="102" text-anchor="middle" style="font-family:var(--display,'Fraunces',serif);font-weight:600;font-size:12px;fill:var(--ink,#f3eee3)">context</text>

  <path d="M282 66 H300" style="fill:none;stroke:var(--rule-bold,rgba(243,238,227,0.42));stroke-width:1" marker-end="url(#hadF00-arrow)"/>

  <!-- 03 typed intent: curly braces -->
  <rect x="304" y="24" width="112" height="86" rx="10" style="fill:var(--paper-2,#12131a);stroke:var(--rule,rgba(243,238,227,0.14));stroke-width:1"/>
  <g transform="translate(351,34)" style="fill:none;stroke:var(--ink-2,#c5c1b8);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round">
    <path d="M6 1.5 q-2.5 0 -2.5 2.5 v2.5 q0 2.5 -2.5 2.5 q2.5 0 2.5 2.5 v2.5 q0 2.5 2.5 2.5"/>
    <path d="M12 1.5 q2.5 0 2.5 2.5 v2.5 q0 2.5 2.5 2.5 q-2.5 0 -2.5 2.5 v2.5 q0 2.5 -2.5 2.5"/>
  </g>
  <text x="360" y="68" text-anchor="middle" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10.5px;letter-spacing:.14em;fill:var(--ash,rgba(243,238,227,0.55))">03</text>
  <text x="360" y="86" text-anchor="middle" style="font-family:var(--display,'Fraunces',serif);font-weight:600;font-size:12px;fill:var(--ink,#f3eee3)">Typed</text>
  <text x="360" y="102" text-anchor="middle" style="font-family:var(--display,'Fraunces',serif);font-weight:600;font-size:12px;fill:var(--ink,#f3eee3)">intent</text>

  <path d="M422 66 H440" style="fill:none;stroke:var(--rule-bold,rgba(243,238,227,0.42));stroke-width:1" marker-end="url(#hadF00-arrow)"/>

  <!-- 04 solver and checks: set square -->
  <rect x="444" y="24" width="112" height="86" rx="10" style="fill:var(--paper-2,#12131a);stroke:var(--rule,rgba(243,238,227,0.14));stroke-width:1"/>
  <g transform="translate(491,34)" style="fill:none;stroke:var(--ink-2,#c5c1b8);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round">
    <path d="M1.5 1.5 V16.5 H16.5 Z M4.5 8.5 V13.5 H9.5 Z"/>
  </g>
  <text x="500" y="68" text-anchor="middle" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10.5px;letter-spacing:.14em;fill:var(--ash,rgba(243,238,227,0.55))">04</text>
  <text x="500" y="86" text-anchor="middle" style="font-family:var(--display,'Fraunces',serif);font-weight:600;font-size:12px;fill:var(--ink,#f3eee3)">Solver &amp;</text>
  <text x="500" y="102" text-anchor="middle" style="font-family:var(--display,'Fraunces',serif);font-weight:600;font-size:12px;fill:var(--ink,#f3eee3)">checks</text>

  <path d="M562 66 H580" style="fill:none;stroke:var(--rule-bold,rgba(243,238,227,0.42));stroke-width:1" marker-end="url(#hadF00-arrow)"/>

  <!-- 05 placed and undoable: check mark and undo arrow -->
  <rect x="584" y="24" width="112" height="86" rx="10" style="fill:var(--accent-soft,rgba(192,139,210,0.14));stroke:var(--accent,#c08bd2);stroke-width:1.5"/>
  <g transform="translate(630,34)" style="fill:none;stroke:var(--accent,#c08bd2);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round">
    <path d="M1 10 L4.5 13.5 L10.5 6.5"/>
    <path d="M12.5 7 H16.5 A3.6 3.6 0 0 1 16.5 14.2 H14 M14.8 4.6 L12.4 7 L14.8 9.4"/>
  </g>
  <text x="640" y="68" text-anchor="middle" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10.5px;letter-spacing:.14em;fill:var(--accent-deep,#a36cb6)">05</text>
  <text x="640" y="86" text-anchor="middle" style="font-family:var(--display,'Fraunces',serif);font-weight:600;font-size:12px;fill:var(--ink,#f3eee3)">Placed &amp;</text>
  <text x="640" y="102" text-anchor="middle" style="font-family:var(--display,'Fraunces',serif);font-weight:600;font-size:12px;fill:var(--ink,#f3eee3)">undoable</text>
</svg>