<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="hadF12-title" style="font-family:var(--serif,'Newsreader',Georgia,serif);background:#0b0c10">
  <title id="hadF12-title">The end-to-end strip from design model through scene context, typed intent, solver and checks to placed, undoable geometry, with the three surfaces beneath.</title>
  <style>@import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600&amp;family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;display=swap');</style>
  <defs>
    <marker id="hadF12-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0.8 L7.4 4 L0 7.2 Z" style="fill:var(--rule-bold,rgba(243,238,227,0.42))"/>
    </marker>
  </defs>

  <!-- stage cards -->
  <g style="fill:var(--paper-2,#12131a);stroke:var(--rule,rgba(243,238,227,0.14));stroke-width:1">
    <rect x="52" y="22" width="104" height="78" rx="10"/>
    <rect x="180" y="22" width="104" height="78" rx="10"/>
    <rect x="308" y="22" width="104" height="78" rx="10"/>
    <rect x="436" y="22" width="104" height="78" rx="10"/>
  </g>
  <rect x="564" y="22" width="104" height="78" rx="10" style="fill:var(--accent-soft,rgba(192,139,210,0.14));stroke:var(--accent,#c08bd2);stroke-width:1.5"/>

  <!-- 01 design model: plan icon -->
  <g transform="translate(95,31)" style="fill:none;stroke:var(--ink-2,#c5c1b8);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round">
    <rect x="0.75" y="1.75" width="16.5" height="14.5" rx="1"/>
    <path d="M10.5 1.75 V11"/>
  </g>
  <!-- 02 scene context: three cards -->
  <g transform="translate(223,31)" style="fill:var(--paper-2,#12131a);stroke:var(--ink-2,#c5c1b8);stroke-width:1.5;stroke-linejoin:round">
    <rect x="5.75" y="0.75" width="11.5" height="8" rx="1.5"/>
    <rect x="3.25" y="4.75" width="11.5" height="8" rx="1.5"/>
    <rect x="0.75" y="8.75" width="11.5" height="8" rx="1.5"/>
  </g>
  <!-- 03 typed intent: braces -->
  <g transform="translate(351,31)" style="fill:none;stroke:var(--ink-2,#c5c1b8);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round">
    <path d="M6 1.5 q-2.5 0 -2.5 2.5 v2.5 q0 2 -2 2.5 q2 0.5 2 2.5 v2.5 q0 2.5 2.5 2.5 M12 1.5 q2.5 0 2.5 2.5 v2.5 q0 2 2 2.5 q-2 0.5 -2 2.5 v2.5 q0 2.5 -2.5 2.5"/>
  </g>
  <!-- 04 solver and checks: set square -->
  <g transform="translate(479,31)" style="fill:none;stroke:var(--ink-2,#c5c1b8);stroke-width:1.5;stroke-linejoin:round">
    <path d="M1.5 16.5 V1.5 L16.5 16.5 Z M5 13 V9 L9 13 Z"/>
  </g>
  <!-- 05 placed and undoable: check and undo -->
  <g transform="translate(606,31)" style="fill:none;stroke:var(--accent,#c08bd2);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round">
    <path d="M1 10 L4.5 13.5 L9.5 7"/>
    <path d="M19 16 V12 q0 -4 -4 -4 H11.5 M13.8 5.5 L11.3 8 L13.8 10.5"/>
  </g>

  <g style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10.5px;letter-spacing:.14em;fill:var(--ash,rgba(243,238,227,0.55))" text-anchor="middle">
    <text x="104" y="63">01</text>
    <text x="232" y="63">02</text>
    <text x="360" y="63">03</text>
    <text x="488" y="63">04</text>
    <text x="616" y="63" style="fill:var(--accent-deep,#a36cb6)">05</text>
  </g>
  <g style="font-family:var(--display,'Fraunces',serif);font-weight:600;font-size:11.5px;fill:var(--ink,#f3eee3)" text-anchor="middle">
    <text x="104" y="78">Design</text>
    <text x="104" y="92">model</text>
    <text x="232" y="78">Scene</text>
    <text x="232" y="92">context</text>
    <text x="360" y="78">Typed</text>
    <text x="360" y="92">intent</text>
    <text x="488" y="78">Solver &amp;</text>
    <text x="488" y="92">checks</text>
    <text x="616" y="78">Placed &amp;</text>
    <text x="616" y="92">undoable</text>
  </g>

  <g style="fill:none;stroke:var(--rule-bold,rgba(243,238,227,0.42));stroke-width:1">
    <path d="M159 61 H177" marker-end="url(#hadF12-arrow)"/>
    <path d="M287 61 H305" marker-end="url(#hadF12-arrow)"/>
    <path d="M415 61 H433" marker-end="url(#hadF12-arrow)"/>
    <path d="M543 61 H561" marker-end="url(#hadF12-arrow)"/>
  </g>

  <!-- the surfaces that render the model and the placed geometry -->
  <path d="M104 101 V124 M616 101 V124" style="fill:none;stroke:var(--rule-bold,rgba(243,238,227,0.42));stroke-width:1.5;stroke-linecap:round;stroke-dasharray:1.5 4"/>
  <rect x="52" y="124" width="616" height="40" rx="12" style="fill:none;stroke:var(--rule-bold,rgba(243,238,227,0.42));stroke-width:1;stroke-dasharray:4 4"/>
  <text x="72" y="148" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10.5px;letter-spacing:.14em;fill:var(--ash,rgba(243,238,227,0.55))">THREE SURFACES</text>

  <g style="fill:none;stroke:var(--accent,#c08bd2);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round">
    <g transform="translate(243,137.5)">
      <rect x="0.75" y="0.75" width="14.5" height="11.5" rx="1"/>
      <path d="M9.5 0.75 V8"/>
    </g>
    <path transform="translate(373,136)" d="M8 0.75 L15.25 4.5 V11.5 L8 15.25 L0.75 11.5 V4.5 Z M0.75 4.5 L8 8.25 L15.25 4.5 M8 8.25 V15.25"/>
    <path transform="translate(541,139)" d="M3 0.75 H17 Q19.25 0.75 19.25 3 V7 Q19.25 9.25 17 9.25 H12.5 L11.2 7.6 Q10 6.4 8.8 7.6 L7.5 9.25 H3 Q0.75 9.25 0.75 7 V3 Q0.75 0.75 3 0.75 Z"/>
  </g>
  <g style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10.5px;letter-spacing:.12em;fill:var(--ink,#f3eee3)">
    <text x="265" y="148">2D EDITOR</text>
    <text x="395" y="148">3D WALKTHROUGH</text>
    <text x="567" y="148">WEBXR</text>
  </g>
  <g style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10.5px;fill:var(--ash,rgba(243,238,227,0.55))" text-anchor="middle">
    <text x="353" y="148">·</text>
    <text x="521" y="148">·</text>
  </g>

  <!-- closing -->
  <text x="360" y="202" text-anchor="middle" style="font-family:var(--display,'Fraunces',serif);font-weight:600;font-size:20px;fill:var(--ink,#f3eee3)">Can you just put the bed in the bedroom?</text>
  <text x="360" y="226" text-anchor="middle" style="font-family:var(--italic,'Instrument Serif',serif);font-style:italic;font-size:15px;fill:var(--accent-deep,#a36cb6)">Now the geometry follows.</text>
</svg>