<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="hadF10-title" style="font-family:var(--serif,'Newsreader',Georgia,serif);background:#0b0c10">
  <title id="hadF10-title">One design model shown as the 2D editor plan, a three-dimensional walkthrough built from the same walls and rooms, and a headset walkthrough.</title>
  <style>@import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600&amp;family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;display=swap');</style>
  <defs>
    <marker id="hadF10-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0.8 L7.4 4 L0 7.2 Z" style="fill:var(--accent,#c08bd2)"/>
    </marker>
  </defs>

  <!-- design model -->
  <rect x="24" y="112" width="76" height="88" rx="10" style="fill:var(--paper-3,#181922);stroke:var(--rule-bold,rgba(243,238,227,0.42));stroke-width:1"/>
  <g transform="translate(52,128)" style="fill:none;stroke:var(--ink-2,#c5c1b8);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round">
    <rect x="0.75" y="0.75" width="18.5" height="14.5" rx="1"/>
    <path d="M11.5 0.75 V10"/>
  </g>
  <g style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10.5px;letter-spacing:.14em;fill:var(--ink,#f3eee3)" text-anchor="middle">
    <text x="63" y="168">DESIGN</text>
    <text x="63" y="183">MODEL</text>
  </g>

  <!-- one source, three renderings -->
  <g style="fill:none;stroke:var(--accent,#c08bd2);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round">
    <path d="M62 112 V44 Q62 34 72 34 H596 Q606 34 606 44 V55" marker-end="url(#hadF10-arrow)"/>
    <path d="M220 34 V55" marker-end="url(#hadF10-arrow)"/>
    <path d="M413 34 V55" marker-end="url(#hadF10-arrow)"/>
  </g>
  <circle cx="220" cy="34" r="2.5" style="fill:var(--accent,#c08bd2)"/>
  <circle cx="413" cy="34" r="2.5" style="fill:var(--accent,#c08bd2)"/>

  <!-- panels -->
  <g style="fill:none;stroke:var(--rule,rgba(243,238,227,0.14));stroke-width:1">
    <rect x="130" y="56" width="180" height="200" rx="10"/>
    <rect x="323" y="56" width="180" height="200" rx="10"/>
    <rect x="516" y="56" width="180" height="200" rx="10"/>
  </g>
  <g style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10.5px;letter-spacing:.12em;fill:var(--ink,#f3eee3)" text-anchor="middle">
    <text x="220" y="80">2D · EDITOR</text>
    <text x="413" y="80">3D · WALK &amp; FLY</text>
    <text x="606" y="80">WEBXR · WALKTHROUGH</text>
  </g>

  <!-- 2D editor: the running bedroom at 0.6 scale -->
  <!-- ROOM: 4.0 x 3.6 m interior = 160 x 144 px; walls 0.2 m = 8 px drawn on the interior outline -->
  <g transform="translate(172,128) scale(0.6)">
    <rect x="0" y="0" width="160" height="144" style="fill:none;stroke:var(--rule-bold,rgba(243,238,227,0.42));stroke-width:8"/>
    <!-- door on the south wall: 0.8 m wide, hinge 1.0 m from the west corner (gap x 40..72); leaf swings north into the room -->
    <rect x="40" y="139" width="32" height="10" style="fill:var(--paper-3,#181922)"/>
    <path d="M40 144 V112" style="fill:none;stroke:var(--accent,#c08bd2);stroke-width:2"/>
    <path d="M40 112 A32 32 0 0 1 72 144" style="fill:none;stroke:var(--accent,#c08bd2);stroke-width:1;stroke-dasharray:2 3"/>
    <!-- window on the east wall: 1.2 m, centred (y 48..96) -->
    <rect x="155" y="48" width="10" height="48" style="fill:var(--paper-3,#181922)"/>
    <path d="M158 48 V96 M162 48 V96" style="fill:none;stroke:var(--accent,#c08bd2);stroke-width:1.5"/>
    <!-- dimension labels (mono 9px, ash): "4.0 m" centred above the north wall at y=-12; "3.6 m" rotated -90 beside the west wall at x=-12 -->
  </g>
  <g transform="translate(172,128) scale(0.6)">
    <rect x="48" y="4" width="64" height="80" rx="3" style="fill:var(--accent-soft,rgba(192,139,210,0.14));stroke:var(--accent,#c08bd2);stroke-width:1.5"/>
    <path d="M48 10 H112" style="fill:none;stroke:var(--accent,#c08bd2);stroke-width:1"/>
    <rect x="52" y="12" width="26" height="9" rx="2" style="fill:none;stroke:var(--accent,#c08bd2);stroke-width:1"/>
    <rect x="82" y="12" width="26" height="9" rx="2" style="fill:none;stroke:var(--accent,#c08bd2);stroke-width:1"/>
    <rect x="24" y="4" width="20" height="20" rx="3" style="fill:var(--accent-soft,rgba(192,139,210,0.14));stroke:var(--accent,#c08bd2);stroke-width:1.5"/>
  </g>

  <!-- 3D walkthrough: the same room seen from the north-west, near walls cut low -->
  <path d="M416.5 232 L347.2 192 L409.6 156 L478.9 196 Z" style="fill:var(--paper-2,#12131a);stroke:var(--rule-bold,rgba(243,238,227,0.42));stroke-width:1;stroke-linejoin:round"/>
  <g style="fill:var(--paper-3,#181922);stroke:var(--rule-bold,rgba(243,238,227,0.42));stroke-width:1;stroke-linejoin:round">
    <!-- east wall with the window -->
    <path d="M347.2 192 L409.6 156 L409.6 108 L347.2 144 Z"/>
    <path d="M347.2 186 L343.8 184 L343.8 142 L347.2 144 Z"/>
    <!-- south wall: door gap with its header above -->
    <path d="M478.9 196 L461.5 186 L461.5 146 L447.7 138 L447.7 178 L409.6 156 L409.6 108 L478.9 148 Z"/>
    <path d="M447.7 178 L451.1 176 L451.1 136 L447.7 138 Z"/>
    <path d="M461.5 186 L447.7 178 L451.1 176 L464.9 184 Z" style="fill:var(--paper-2,#12131a)"/>
    <path d="M478.9 190 L482.3 188 L482.3 146 L478.9 148 Z"/>
    <!-- wall tops -->
    <path d="M347.2 144 L409.6 108 L478.9 148 L482.3 146 L409.6 104 L343.8 142 Z"/>
  </g>
  <path d="M368 162 L388.8 150 L388.8 126 L368 138 Z" style="fill:var(--accent-soft,rgba(192,139,210,0.14));stroke:var(--accent,#c08bd2);stroke-width:1.5;stroke-linejoin:round"/>
  <path d="M378.4 156 V132" style="fill:none;stroke:var(--accent,#c08bd2);stroke-width:1"/>
  <!-- bed and nightstand as low boxes -->
  <g style="stroke:var(--accent,#c08bd2);stroke-width:1;stroke-linejoin:round">
    <path d="M397.4 219 L369.7 203 L369.7 193 L397.4 209 Z" style="fill:var(--paper-3,#181922)"/>
    <path d="M397.4 219 L432.1 199 L432.1 189 L397.4 209 Z" style="fill:var(--paper-3,#181922)"/>
    <path d="M397.4 209 L369.7 193 L404.4 173 L432.1 189 Z" style="fill:var(--accent-soft,rgba(192,139,210,0.14))"/>
    <path d="M407.8 225 L399.2 220 L399.2 210 L407.8 215 Z" style="fill:var(--paper-3,#181922)"/>
    <path d="M407.8 225 L416.5 220 L416.5 210 L407.8 215 Z" style="fill:var(--paper-3,#181922)"/>
    <path d="M407.8 215 L399.2 210 L407.8 205 L416.5 210 Z" style="fill:var(--accent-soft,rgba(192,139,210,0.14))"/>
  </g>
  <!-- near walls, cut low -->
  <g style="fill:var(--paper-3,#181922);stroke:var(--rule-bold,rgba(243,238,227,0.42));stroke-width:1;stroke-linejoin:round">
    <path d="M416.5 236 L340.3 192 L340.3 186 L416.5 230 Z"/>
    <path d="M416.5 236 L485.8 196 L485.8 190 L416.5 230 Z"/>
    <path d="M416.5 230 L340.3 186 L343.8 184 L416.5 226 L482.3 188 L485.8 190 Z"/>
  </g>

  <!-- WebXR: a headset frame around a view of the same room, facing north -->
  <path d="M549 116 H663 Q681 116 681 134 V186 Q681 204 663 204 H622 Q616 204 613 198 L610 193 Q606 187 602 193 L599 198 Q596 204 590 204 H549 Q531 204 531 186 V134 Q531 116 549 116 Z" style="fill:none;stroke:var(--rule-bold,rgba(243,238,227,0.42));stroke-width:1.5;stroke-linejoin:round"/>
  <path d="M523 152 H531 M681 152 H689" style="fill:none;stroke:var(--rule-bold,rgba(243,238,227,0.42));stroke-width:1.5;stroke-linecap:round"/>
  <path d="M580 166 H632 L658 186.8 H554 Z" style="fill:var(--paper-2,#12131a);stroke:none"/>
  <g style="fill:none;stroke:var(--rule-bold,rgba(243,238,227,0.42));stroke-width:1;stroke-linejoin:round">
    <rect x="580" y="134.8" width="52" height="31.2"/>
    <path d="M580 166 L554 186.8 M632 166 L658 186.8 M580 134.8 L554 124.4 M632 134.8 L658 124.4"/>
  </g>
  <path d="M641.2 157.5 V136.4 L655.8 132.7 V162.6 Z" style="fill:var(--accent-soft,rgba(192,139,210,0.14));stroke:var(--accent,#c08bd2);stroke-width:1.2;stroke-linejoin:round"/>
  <g style="stroke:var(--accent,#c08bd2);stroke-width:1;stroke-linejoin:round">
    <path d="M595.4 154.5 H616.6 V159.8 H595.4 Z" style="fill:var(--paper-3,#181922)"/>
    <path d="M595.4 159.8 H616.6 L625.1 171.5 H586.9 Z" style="fill:var(--accent-soft,rgba(192,139,210,0.14))"/>
    <path d="M586.9 171.5 H625.1 V183.5 H586.9 Z" style="fill:var(--paper-3,#181922)"/>
    <path d="M587.4 159.8 H594 L592.2 162.1 H584.5 Z" style="fill:var(--accent-soft,rgba(192,139,210,0.14))"/>
    <path d="M584.5 162.1 H592.2 V169.7 H584.5 Z" style="fill:var(--paper-3,#181922)"/>
  </g>
  <text x="606" y="234" text-anchor="middle" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10px;letter-spacing:.1em;fill:var(--ash,rgba(243,238,227,0.55))">WALK · NO EDITING TOOLS</text>

  <!-- motto -->
  <text x="24" y="284" style="font-family:var(--italic,'Instrument Serif',serif);font-style:italic;font-size:15px;fill:var(--ash,rgba(243,238,227,0.55))">Drawn once, rendered three ways.</text>
</svg>