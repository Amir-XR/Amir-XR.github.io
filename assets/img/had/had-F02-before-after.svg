<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="hadF02-title" style="font-family:var(--serif,'Newsreader',Georgia,serif);background:#0b0c10">
  <title id="hadF02-title">Before, the model could only describe where to click and a desk and chair landed in opposite corners; after, a typed instruction is placed by the solver.</title>
  <style>@import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600&amp;family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;display=swap');</style>
  <defs>
    <marker id="hadF02-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0.8 L7.4 4 L0 7.2 Z" style="fill:var(--accent,#c08bd2)"/>
    </marker>
  </defs>

  <path d="M344 24 V298" style="fill:none;stroke:var(--rule,rgba(243,238,227,0.14));stroke-width:1"/>

  <!-- BEFORE -->
  <text x="24" y="40" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10.5px;letter-spacing:.14em;fill:var(--ash,rgba(243,238,227,0.55))">BEFORE · MODEL GUIDES THE CLICK</text>
  <g style="font-size:13px;fill:var(--ink,#f3eee3)">
    <text x="24" y="66">“desk against the north wall,</text>
    <text x="29" y="84">chair tucked under it”</text>
  </g>
  <rect x="24" y="98" width="296" height="32" rx="16" style="fill:none;stroke:var(--ash,rgba(243,238,227,0.55));stroke-width:1.2;stroke-dasharray:4 3"/>
  <path transform="translate(39,105.5) scale(0.82)" d="M0 0 l0 16.5 4.5 -3.8 3 6.8 3.8 -1.5 -3 -6.8 6 -0.8 z" style="fill:none;stroke:var(--ink-2,#c5c1b8);stroke-width:1.5;stroke-linejoin:round"/>
  <text x="58" y="118" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:11px;fill:var(--ash,rgba(243,238,227,0.55))">"try the top-left… no, further right"</text>

  <!-- ROOM: 4.0 x 3.6 m interior = 160 x 144 px; walls 0.2 m = 8 px drawn on the interior outline -->
  <g transform="translate(40,150) scale(0.8)">
    <rect x="0" y="0" width="160" height="144" style="fill:none;stroke:var(--rule-bold,rgba(243,238,227,0.42));stroke-width:8"/>
    <!-- door on the south wall: 0.8 m wide, hinge 1.0 m from the west corner (gap x 40..72); leaf swings north into the room -->
    <rect x="40" y="139" width="32" height="10" style="fill:var(--paper-3,#181922)"/>
    <path d="M40 144 V112" style="fill:none;stroke:var(--accent,#c08bd2);stroke-width:2"/>
    <path d="M40 112 A32 32 0 0 1 72 144" style="fill:none;stroke:var(--accent,#c08bd2);stroke-width:1;stroke-dasharray:2 3"/>
    <!-- window on the east wall: 1.2 m, centred (y 48..96) -->
    <rect x="155" y="48" width="10" height="48" style="fill:var(--paper-3,#181922)"/>
    <path d="M158 48 V96 M162 48 V96" style="fill:none;stroke:var(--accent,#c08bd2);stroke-width:1.5"/>
    <!-- dimension labels (mono 9px, –ash): "4.0 m" centred above the north wall at y=-12; "3.6 m" rotated -90 beside the west wall at x=-12 -->
  </g>
  <!-- desk in the north-east corner, chair in the south-west corner: placed by clicks, unchecked -->
  <g transform="translate(40,150) scale(0.8)" style="fill:none;stroke:var(--ash,rgba(243,238,227,0.55));stroke-width:1.5;stroke-dasharray:5 3.75">
    <rect x="108" y="4" width="48" height="24" rx="3"/>
    <rect x="4" y="120" width="20" height="20" rx="3"/>
    <path d="M9 120 V140"/>
  </g>
  <path d="M133 175 L62 243" style="fill:none;stroke:var(--ash,rgba(243,238,227,0.55));stroke-width:1;stroke-dasharray:1.5 4;stroke-linecap:round"/>
  <circle cx="98" cy="209" r="9" style="fill:var(--paper-3,#181922);stroke:var(--ash,rgba(243,238,227,0.55));stroke-width:1"/>
  <text x="98" y="213" text-anchor="middle" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:11px;fill:var(--ash,rgba(243,238,227,0.55))">?</text>
  <g style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10.5px;fill:var(--ash,rgba(243,238,227,0.55))">
    <text x="188" y="194">described, not drawn ·</text>
    <text x="188" y="209">paired items treated</text>
    <text x="188" y="224">as independent</text>
  </g>

  <text x="24" y="304" style="font-family:var(--italic,'Instrument Serif',serif);font-style:italic;font-size:14px;fill:var(--ash,rgba(243,238,227,0.55))">Fluent in words, blind to the wall.</text>

  <!-- AFTER -->
  <text x="368" y="40" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10.5px;letter-spacing:.14em;fill:var(--ash,rgba(243,238,227,0.55))">AFTER · MODEL INTERPRETS, SOLVER PLACES</text>
  <rect x="368" y="54" width="262" height="50" rx="8" style="fill:none;stroke:var(--ash,rgba(243,238,227,0.55));stroke-width:1.2;stroke-dasharray:4 3"/>
  <g style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10.5px;fill:var(--ash,rgba(243,238,227,0.55))">
    <text x="384" y="75">desk · against: north wall</text>
    <text x="384" y="93">chair · relative: desk · side: front</text>
  </g>
  <path d="M500 110 V140" style="fill:none;stroke:var(--accent,#c08bd2);stroke-width:2" marker-end="url(#hadF02-arrow)"/>

  <!-- ROOM: 4.0 x 3.6 m interior = 160 x 144 px; walls 0.2 m = 8 px drawn on the interior outline -->
  <g transform="translate(420,150)">
    <rect x="0" y="0" width="160" height="144" style="fill:none;stroke:var(--rule-bold,rgba(243,238,227,0.42));stroke-width:8"/>
    <!-- door on the south wall: 0.8 m wide, hinge 1.0 m from the west corner (gap x 40..72); leaf swings north into the room -->
    <rect x="40" y="139" width="32" height="10" style="fill:var(--paper-3,#181922)"/>
    <path d="M40 144 V112" style="fill:none;stroke:var(--accent,#c08bd2);stroke-width:2"/>
    <path d="M40 112 A32 32 0 0 1 72 144" style="fill:none;stroke:var(--accent,#c08bd2);stroke-width:1;stroke-dasharray:2 3"/>
    <!-- window on the east wall: 1.2 m, centred (y 48..96) -->
    <rect x="155" y="48" width="10" height="48" style="fill:var(--paper-3,#181922)"/>
    <path d="M158 48 V96 M162 48 V96" style="fill:none;stroke:var(--accent,#c08bd2);stroke-width:1.5"/>
    <!-- dimension labels (mono 9px, –ash): "4.0 m" centred above the north wall at y=-12; "3.6 m" rotated -90 beside the west wall at x=-12 -->
  </g>
  <!-- committed: desk against the north wall, chair directly in front of it (back band to the south) -->
  <g transform="translate(420,150)" style="fill:var(--accent-soft,rgba(192,139,210,0.14));stroke:var(--accent,#c08bd2);stroke-width:1.5">
    <rect x="56" y="4" width="48" height="24" rx="3"/>
    <rect x="70" y="30" width="20" height="20" rx="3"/>
    <path d="M70 46 H90" style="fill:none"/>
  </g>
</svg>