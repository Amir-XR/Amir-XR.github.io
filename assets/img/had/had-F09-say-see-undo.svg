<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="hadF09-title" style="font-family:var(--serif,'Newsreader',Georgia,serif);background:#0b0c10">
  <title id="hadF09-title">Placed furniture carries a small AI badge; the assistant explains the placement in spatial language; the inspector shows which tool and tier placed it; walls and openings remain the person's to place.</title>
  <style>@import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600&amp;family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;display=swap');</style>

  <!-- editor crop -->
  <rect x="24" y="24" width="282" height="262" rx="10" style="fill:none;stroke:var(--rule,rgba(243,238,227,0.14));stroke-width:1"/>

  <!-- ROOM: 4.0 x 3.6 m interior = 160 x 144 px; walls 0.2 m = 8 px drawn on the interior outline -->
  <g transform="translate(69,74) scale(1.2)">
    <rect x="0" y="0" width="160" height="144" style="fill:none;stroke:var(--rule-bold,rgba(243,238,227,0.42));stroke-width:8"/>
    <!-- door on the south wall: 0.8 m wide, hinge 1.0 m from the west corner (gap x 40..72); leaf swings north into the room -->
    <rect x="40" y="139" width="32" height="10" style="fill:var(--paper-3,#181922)"/>
    <path d="M40 144 V112" style="fill:none;stroke:var(--accent,#c08bd2);stroke-width:2"/>
    <path d="M40 112 A32 32 0 0 1 72 144" style="fill:none;stroke:var(--accent,#c08bd2);stroke-width:1;stroke-dasharray:2 3"/>
    <!-- window on the east wall: 1.2 m, centred (y 48..96) -->
    <rect x="155" y="48" width="10" height="48" style="fill:var(--paper-3,#181922)"/>
    <path d="M158 48 V96 M162 48 V96" style="fill:none;stroke:var(--accent,#c08bd2);stroke-width:1.5"/>
    <!-- dimension labels (mono 9px, ash): "4.0 m" centred above the north wall at y=-12; "3.6 m" rotated -90 beside the west wall at x=-12 -->
  </g>

  <!-- dimensions (set at figure scale so they stay above 10 px) -->
  <g style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10px;fill:var(--ash,rgba(243,238,227,0.55))">
    <text x="165" y="60" text-anchor="middle">4.0 m</text>
    <text transform="translate(53,160) rotate(-90)" text-anchor="middle">3.6 m</text>
  </g>

  <!-- committed furniture: queen bed on the north wall, nightstand on the left -->
  <g transform="translate(69,74) scale(1.2)">
    <rect x="48" y="4" width="64" height="80" rx="3" style="fill:var(--accent-soft,rgba(192,139,210,0.14));stroke:var(--accent,#c08bd2);stroke-width:1.5"/>
    <path d="M48 10 H112" style="fill:none;stroke:var(--accent,#c08bd2);stroke-width:1"/>
    <rect x="52" y="12" width="26" height="9" rx="2" style="fill:none;stroke:var(--accent,#c08bd2);stroke-width:1"/>
    <rect x="82" y="12" width="26" height="9" rx="2" style="fill:none;stroke:var(--accent,#c08bd2);stroke-width:1"/>
    <rect x="24" y="4" width="20" height="20" rx="3" style="fill:var(--accent-soft,rgba(192,139,210,0.14));stroke:var(--accent,#c08bd2);stroke-width:1.5"/>
  </g>

  <!-- the badge the editor shows beside an AI placement -->
  <rect x="209" y="100" width="40" height="18" rx="9" style="fill:var(--accent-soft,rgba(192,139,210,0.14))"/>
  <text x="229" y="112.5" text-anchor="middle" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10.5px;font-weight:500;letter-spacing:.06em;fill:var(--accent,#c08bd2)">↻ AI</text>

  <!-- the room label the person placed -->
  <text x="210" y="219" text-anchor="middle" style="font-family:var(--display,'Fraunces',serif);font-weight:600;font-size:13px;fill:var(--ink-2,#c5c1b8)">Bedroom</text>

  <!-- assistant -->
  <rect x="330" y="24" width="366" height="78" rx="10" style="fill:var(--paper-3,#181922);stroke:var(--rule,rgba(243,238,227,0.14));stroke-width:1"/>
  <path d="M348 36.75 h12 q1.25 0 1.25 1.25 v7 q0 1.25 -1.25 1.25 h-7 l-3.5 3 v-3 h-1.5 q-1.25 0 -1.25 -1.25 v-7 q0 -1.25 1.25 -1.25 z" style="fill:none;stroke:var(--accent,#c08bd2);stroke-width:1.5;stroke-linejoin:round"/>
  <text x="372" y="47" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10.5px;letter-spacing:.14em;fill:var(--ink,#f3eee3)">ASSISTANT</text>
  <text x="346" y="71" style="font-size:12.5px;fill:var(--ink,#f3eee3)">“Bed against the longest clear wall,</text>
  <text x="346" y="88" style="font-size:12.5px;fill:var(--ink,#f3eee3)">facing into the room. Undo if it’s wrong.”</text>

  <!-- inspector -->
  <rect x="330" y="114" width="366" height="106" rx="10" style="fill:var(--paper-3,#181922);stroke:var(--rule,rgba(243,238,227,0.14));stroke-width:1"/>
  <g style="fill:none;stroke:var(--accent,#c08bd2);stroke-width:1.5;stroke-linecap:round">
    <circle cx="354" cy="133" r="7"/>
    <path d="M354 131.5 V136.5"/>
  </g>
  <circle cx="354" cy="128.6" r="1" style="fill:var(--accent,#c08bd2)"/>
  <text x="372" y="137" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10.5px;letter-spacing:.14em;fill:var(--ink,#f3eee3)">INSPECTOR · PROVENANCE</text>
  <g style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:11.5px">
    <text x="346" y="161" style="fill:var(--ash,rgba(243,238,227,0.55))">placed by</text>
    <text x="436" y="161" style="fill:var(--accent,#c08bd2)">AI</text>
    <text x="346" y="177" style="fill:var(--ash,rgba(243,238,227,0.55))">tool</text>
    <text x="436" y="177" style="fill:var(--ink,#f3eee3)">place_with_anchor</text>
    <text x="346" y="193" style="fill:var(--ash,rgba(243,238,227,0.55))">tier</text>
    <text x="436" y="193" style="fill:var(--ink,#f3eee3)">single item</text>
    <text x="346" y="209" style="fill:var(--ash,rgba(243,238,227,0.55))">at</text>
    <text x="436" y="209" style="fill:var(--ink,#f3eee3)">14:02:17</text>
  </g>

  <!-- what stays with the person -->
  <rect x="330" y="232" width="366" height="54" rx="10" style="fill:none;stroke:var(--rule,rgba(243,238,227,0.14));stroke-width:1"/>
  <path d="M348 240 V253 L351.5 249.8 L354 255 L356.2 254 L353.8 248.8 L358.5 248.6 Z" style="fill:none;stroke:var(--ash,rgba(243,238,227,0.55));stroke-width:1.3;stroke-linejoin:round"/>
  <text x="372" y="252" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:10.5px;letter-spacing:.14em;fill:var(--ash,rgba(243,238,227,0.55))">YOU DRAW</text>
  <text x="346" y="272" style="font-family:var(--mono,'JetBrains Mono',ui-monospace,monospace);font-size:11px;fill:var(--ash,rgba(243,238,227,0.55))">walls · doors · windows · labels — click to place</text>

  <!-- motto -->
  <text x="24" y="314" style="font-family:var(--italic,'Instrument Serif',serif);font-style:italic;font-size:15px;fill:var(--ash,rgba(243,238,227,0.55))">The person stays the author.</text>
</svg>